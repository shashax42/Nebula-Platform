# ==========================================================================
# Dev 로컬 복제본 — 운영 구성요소를 가볍게 복제한다 (AWS 불필요)
#
#   운영(EKS)                          로컬(이 파일)
#   RDS MySQL (account/order/product)  mysql        + mysql/init.sql
#   ElastiCache Redis Cluster (TLS)    redis-1..3   (3 샤드 클러스터, TLS 없음)
#   Strimzi Kafka (market-message)     kafka        (KRaft 단일 노드)
#   config-* ConfigMap / secret-*      env/*.env    (Terraform services.tf 와 같은 변수 이름)
#   OTel Collector → AMP/X-Ray/CW      Nebula-Monitoring/tools/local-stack (host :4318)
#
# 사용
#   docker compose up -d                                   # 데이터 계층만 (IDE 에서 서비스 실행할 때)
#   NEBULA_SERVICES_DIR=../../../../nebula-services \
#     docker compose --profile app up -d --build           # 서비스까지 소스에서 빌드해 실행
#   docker compose stop redis-1 redis-2 redis-3            # 캐시 장애 시 실패 양상 관찰
# ==========================================================================

x-redis: &redis
  image: redis:7.2
  command: ["redis-server", "--port", "6379", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
            "--cluster-node-timeout", "5000", "--appendonly", "no", "--requirepass", "local-redis", "--masterauth", "local-redis"]
  healthcheck:
    test: ["CMD", "redis-cli", "-a", "local-redis", "--no-auth-warning", "ping"]
    interval: 5s
    retries: 20

x-service: &service
  profiles: [app]
  restart: on-failure
  extra_hosts: ["host.docker.internal:host-gateway"]
  depends_on:
    mysql-init: { condition: service_completed_successfully }
    redis-init: { condition: service_completed_successfully }
    kafka: { condition: service_healthy }

services:
  # ---- 데이터 계층 --------------------------------------------------------
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-db
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plocal-db"]
      interval: 5s
      retries: 30

  # 운영의 db-bootstrap Job 과 같은 일: 서비스 스키마 생성 (멱등)
  mysql-init:
    image: mysql:8.4
    depends_on: { mysql: { condition: service_healthy } }
    volumes: ["./mysql/init.sql:/init.sql:ro"]
    entrypoint: ["sh", "-c", "mysql -h mysql -uroot -plocal-db < /init.sql"]

  redis-1: *redis
  redis-2: *redis
  redis-3: *redis

  redis-init:
    image: redis:7.2
    depends_on:
      redis-1: { condition: service_healthy }
      redis-2: { condition: service_healthy }
      redis-3: { condition: service_healthy }
    entrypoint: ["sh", "-c"]
    command:
      - |
        redis-cli -h redis-1 -a local-redis --no-auth-warning cluster info | grep -q 'cluster_state:ok' && exit 0
        nodes=$$(for h in redis-1 redis-2 redis-3; do printf '%s:6379 ' $$(getent hosts $$h | awk '{print $$1}'); done)
        redis-cli -a local-redis --no-auth-warning --cluster create $$nodes --cluster-replicas 0 --cluster-yes

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 30

  # ---- 서비스 (nebula-services 소스에서 빌드) -------------------------------
  core-gateway:
    <<: *service
    build: ${NEBULA_SERVICES_DIR:-../../../../nebula-services}/core-gateway
    env_file: [env/common.env, env/config-gateway.env]
    ports: ["8080:8080"]

  service-account:
    <<: *service
    build: ${NEBULA_SERVICES_DIR:-../../../../nebula-services}/service-account
    env_file: [env/common.env, env/config-account.env]

  service-order:
    <<: *service
    build: ${NEBULA_SERVICES_DIR:-../../../../nebula-services}/service-order
    env_file: [env/common.env, env/config-order.env]

  service-product:
    <<: *service
    build: ${NEBULA_SERVICES_DIR:-../../../../nebula-services}/service-product
    env_file: [env/common.env, env/config-product.env]
